name: pickleball_app
description: "A mobile Pickleball game built with Flutter and Flame."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flame_audio: ^2.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true 

  assets:
    - assets/audio/
    - assets/paddles/